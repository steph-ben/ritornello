<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritornello</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header class="track">
      <span id="track-name" class="track-name">Choisissez un morceau dans une liste.</span>
    </header>
    <p id="message" class="message" hidden></p>

    <section class="settings">
      <div class="stepper">
        <span class="label">Transposition</span>
        <button id="pitch-down" aria-label="Baisser d'un demi-ton">−</button>
        <span id="pitch-value" class="value">0</span>
        <button id="pitch-up" aria-label="Monter d'un demi-ton">+</button>
      </div>
      <div class="stepper">
        <span class="label">Vitesse</span>
        <button id="speed-down" aria-label="Ralentir">−</button>
        <span id="speed-value" class="value">100 %</span>
        <button id="speed-up" aria-label="Accélérer">+</button>
      </div>
    </section>

    <div class="counter">
      <span id="counter-time">00:00</span>
      <span id="counter-loop" class="counter-loop" hidden></span>
    </div>

    <canvas id="timeline" class="timeline"></canvas>

    <section class="markers">
      <button id="add-marker" disabled>+ Marker</button>
      <ul id="marker-list" class="marker-list"></ul>
    </section>

    <section class="loop">
      <label>Boucle de <select id="loop-from"></select></label>
      <label>à <select id="loop-to"></select></label>
      <button id="loop-button" class="loop-button" aria-pressed="false" disabled>⟲ Boucle</button>
    </section>

    <footer class="transport">
      <button id="go-start" aria-label="Retour au début" disabled>⏮</button>
      <button id="go-back" aria-label="Reculer de 5 secondes" disabled>−5</button>
      <button id="play-button" class="play-button" aria-label="Lecture" disabled>▶</button>
      <button id="go-forward" aria-label="Avancer de 5 secondes" disabled>+5</button>
      <span id="loop-badge" class="loop-badge" hidden></span>
      <span id="clock" class="clock">00:00 / 00:00</span>
    </footer>

    <section class="lists">
      <div class="list-bar">
        <select id="list-select" aria-label="Liste de morceaux"></select>
        <button id="new-list">Nouvelle liste</button>
        <button id="rename-list">Renommer</button>
        <button id="delete-list">Supprimer la liste</button>
      </div>
      <ul id="track-list" class="track-list"></ul>
      <button id="add-track">Ajouter un morceau</button>
    </section>
  </main>
</body>
</html>
