<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test YouTube</title>
<style>
  body { background: #111; color: #eee; font: 16px system-ui, sans-serif; margin: 0; padding: 12px; }
  h2 { font-size: 16px; margin: 16px 0 6px; color: #9cf; }
  input, button { font: inherit; min-height: 44px; min-width: 44px; padding: 0 12px;
                  border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  button { margin: 0 6px 6px 0; }
  button.actif { background: #276; border-color: #4c9; }
  #lecteur-zone { width: 100%; max-width: 480px; aspect-ratio: 16 / 9; min-height: 200px; background: #000; }
  #lecteur-zone iframe { width: 100%; height: 100%; display: block; }
  #journal { background: #000; color: #8f8; font: 12px monospace; padding: 8px; min-height: 120px;
             white-space: pre-wrap; word-break: break-all; margin: 0; }
</style>
</head>
<body>
<h2>1. Vidéo</h2>
<input id="champ" placeholder="Lien YouTube ou identifiant" autocomplete="off">
<button id="charger">Charger</button>
<div id="lecteur-zone"><div id="lecteur"></div></div>

<h2>2. Vitesses</h2>
<div id="vitesses"></div>
<button id="essai-085">Essayer 0.85</button>
<div id="vitesse-lue">Vitesse lue : -</div>

<h2>3. Boucle A-B</h2>
<button id="point-a">A = maintenant</button>
<button id="point-b">B = maintenant</button>
<button id="boucle">Boucle : off</button>
<div id="etat-boucle">A : - / B : - / passages : 0</div>

<h2>4. Journal</h2>
<pre id="journal"></pre>

<script>
const lignesJournal = [];
let lecteur = null;
let pointA = null;
let pointB = null;
let passages = 0;
let minuteur = null;
let sautEnCours = false;

const $ = (id) => document.getElementById(id);

function noter(texte) {
  const heure = new Date().toLocaleTimeString("fr-FR");
  lignesJournal.push(heure + " " + texte);
  if (lignesJournal.length > 20) lignesJournal.shift();
  $("journal").textContent = lignesJournal.join("\n");
}

window.addEventListener("error", (e) => noter("ERREUR JS : " + e.message));

// Accepte watch?v=, youtu.be/, shorts/ ou un identifiant seul.
function extraireIdentifiant(texte) {
  texte = texte.trim();
  if (/^[\w-]{11}$/.test(texte)) return texte;
  try {
    const url = new URL(texte);
    if (url.hostname === "youtu.be") return url.pathname.slice(1, 12);
    if (url.searchParams.get("v")) return url.searchParams.get("v");
    const shorts = url.pathname.match(/^\/shorts\/([\w-]{11})/);
    if (shorts) return shorts[1];
  } catch (e) { /* pas une URL */ }
  return null;
}

function charger() {
  const id = extraireIdentifiant($("champ").value);
  if (!id) return noter("Lien ou identifiant non reconnu");
  if (!lecteur) return noter("API pas encore prête, réessaie");
  noter("Chargement de " + id);
  lecteur.loadVideoById(id);
}

function changerVitesse(vitesse) {
  lecteur.setPlaybackRate(vitesse);
  // Le lecteur met un instant à répondre.
  setTimeout(() => {
    const lue = lecteur.getPlaybackRate();
    $("vitesse-lue").textContent = "Vitesse lue : " + lue;
    noter("Demandé " + vitesse + ", lu " + lue);
  }, 300);
}

function afficherVitesses() {
  const liste = lecteur.getAvailablePlaybackRates();
  noter("Vitesses : " + liste.join(", "));
  $("vitesses").innerHTML = "";
  for (const vitesse of liste) {
    const bouton = document.createElement("button");
    bouton.textContent = vitesse;
    bouton.onclick = () => changerVitesse(vitesse);
    $("vitesses").appendChild(bouton);
  }
}

function afficherEtatBoucle() {
  const a = pointA === null ? "-" : pointA.toFixed(2);
  const b = pointB === null ? "-" : pointB.toFixed(2);
  $("etat-boucle").textContent = "A : " + a + " / B : " + b + " / passages : " + passages;
}

function poserPoint(nom) {
  const temps = lecteur.getCurrentTime();
  if (nom === "A") pointA = temps; else pointB = temps;
  noter("Point " + nom + " = " + temps.toFixed(2) + " s");
  afficherEtatBoucle();
}

function sauterAuDebut() {
  sautEnCours = true;
  lecteur.seekTo(pointA, true);
  passages++;
  const numero = passages;
  setTimeout(() => {
    const ecartMs = Math.round((lecteur.getCurrentTime() - pointA) * 1000);
    noter("Saut " + numero + " : écart " + ecartMs + " ms (300 ms après)");
    sautEnCours = false;
    afficherEtatBoucle();
  }, 300);
}

function surveillerBoucle() {
  if (sautEnCours) return;
  if (lecteur.getCurrentTime() >= pointB) sauterAuDebut();
}

function basculerBoucle() {
  if (minuteur) {
    clearInterval(minuteur);
    minuteur = null;
  } else if (pointA === null || pointB === null || pointB <= pointA) {
    return noter("Pose A puis B (B après A) avant la boucle");
  } else {
    minuteur = setInterval(surveillerBoucle, 50);
  }
  $("boucle").textContent = "Boucle : " + (minuteur ? "on" : "off");
  $("boucle").classList.toggle("actif", !!minuteur);
}

const NOMS_ETATS = { "-1": "pas démarré", 0: "fini", 1: "lecture", 2: "pause", 3: "tampon", 5: "prêt" };

function creerLecteur() {
  lecteur = new YT.Player("lecteur", {
    width: "100%", height: "100%",
    playerVars: { playsinline: 1 },
    events: {
      onReady: () => noter("Lecteur prêt"),
      onStateChange: (e) => {
        noter("État : " + (NOMS_ETATS[e.data] || e.data));
        if (e.data === 1) afficherVitesses();
      },
      onPlaybackRateChange: (e) => noter("Vitesse changée : " + e.data),
      onError: (e) => noter("ERREUR lecteur : code " + e.data),
    },
  });
}

window.onYouTubeIframeAPIReady = creerLecteur;

document.addEventListener("visibilitychange", () => noter("Page " + document.visibilityState));
$("charger").onclick = charger;
$("essai-085").onclick = () => changerVitesse(0.85);
$("point-a").onclick = () => poserPoint("A");
$("point-b").onclick = () => poserPoint("B");
$("boucle").onclick = basculerBoucle;
noter("Page chargée");
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
